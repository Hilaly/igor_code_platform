packages:
  - apps/*
  - packages/*

# esbuild распаковывает свой бинарь в postinstall — без этого Vite не запустится.
# Список ведётся явно: любой новый пакет со скриптами установки требует решения.
allowBuilds:
  esbuild: true
  # Каталог компонентов трансформирует истории через SWC, а тот распаковывает нативный бинарь.
  # Разрешено: без этого не запускается `make catalog`.
  "@swc/core": true
  # Приехал зависимостью каталога компонентов. Его postinstall кладёт воркер для перехвата запросов
  # в браузере, а мы ничего не перехватываем: запрещено.
  msw: false
  # Оба приехали зависимостями Pi (@sovereign/agent-runtime-pi).
  # У опубликованного @google/genai нет каталога scripts/, на который ссылается его prepare:
  # запусти мы его — установка сломалась бы. Запрещено.
  "@google/genai": false
  # postinstall у protobufjs только сверяет диапазон версии у зависимого пакета и печатает
  # предупреждение — ничего не распаковывает. Запрещено: пользы ноль.
  protobufjs: false
