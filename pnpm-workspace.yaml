packages:
  - apps/*
  - packages/*

# esbuild распаковывает свой бинарь в postinstall — без этого Vite не запустится.
# Список ведётся явно: любой новый пакет со скриптами установки требует решения.
allowBuilds:
  esbuild: true
  # Каталог компонентов трансформирует истории через SWC, а тот распаковывает нативный бинарь.
  # Разрешено: без этого не запускается `make catalog`.
  "@swc/core": true
  # Приехал зависимостью каталога компонентов. Его postinstall кладёт воркер для перехвата запросов
  # в браузере, а мы ничего не перехватываем: запрещено.
  msw: false
